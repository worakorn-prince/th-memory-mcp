name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24', '26']
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Version sync check
        run: npm run version:check

      - name: Capture sync check
        run: npm run check:capture-sync

      # Serial execution keeps the resource-heavy suites (vector cache, boot
      # probes) from starving each other. One retry absorbs machine-load flakes;
      # a genuine failure fails both runs.
      - name: Run tests
        shell: bash
        env:
          MEMORY_AUTH: ''
          MEMORY_ENCRYPTION: ''
          MEMORY_ENCRYPTION_KEY: ''
        run: |
          set -o pipefail
          if node scripts/run-tests.mjs --test-concurrency=1 test/*.test.mjs test/smoke.mjs; then
            echo "tests passed on first run"
            exit 0
          fi
          echo "first run failed; retrying once to rule out a load-induced flake"
          node scripts/run-tests.mjs --test-concurrency=1 test/*.test.mjs test/smoke.mjs

  encrypted:
    name: Encrypted DB (Ubuntu / Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

      - name: Run tests with encryption enabled
        shell: bash
        env:
          MEMORY_AUTH: ''
        run: |
          set -o pipefail
          export MEMORY_ENCRYPTION=on
          export MEMORY_ENCRYPTION_KEY="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64'))")"
          node scripts/run-tests.mjs --test-concurrency=1 test/*.test.mjs test/smoke.mjs

  authenticated:
    name: Auth + scope (Ubuntu / Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

      - name: Run tests with auth enabled
        shell: bash
        env:
          MEMORY_ENCRYPTION: ''
          MEMORY_ENCRYPTION_KEY: ''
        run: |
          set -o pipefail
          export MEMORY_DB_PATH="$RUNNER_TEMP/auth.db"
          node dist/cli.js auth add-user ci-runner --role owner
          TOKEN="$(node dist/cli.js auth issue-token ci-runner --label ci)"
          export MEMORY_AUTH=on
          export MEMORY_AUTH_TOKEN="$TOKEN"
          node scripts/run-tests.mjs --test-concurrency=1 \
            test/auth_identity.test.mjs \
            test/auth_guard.test.mjs \
            test/auth_policy.test.mjs \
            test/auth_token.test.mjs \
            test/scope_resolver.test.mjs \
            test/scope_grants.test.mjs \
            test/scope_isolation.test.mjs \
            test/scope_reads.test.mjs \
            test/audit_log.test.mjs \
            test/interactions_scope.test.mjs

  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Plugin typecheck
        run: npm run typecheck:plugin

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
