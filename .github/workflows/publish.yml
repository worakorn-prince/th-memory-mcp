name: Publish to GitHub Packages

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@worakorn-prince'
      - run: npm install
      - run: npm run build
      - name: Set scoped name for GitHub Packages
        run: npm pkg set name=@worakorn-prince/th-memory-mcp
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
