name: version-sync
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: node scripts/sync-version.mjs --check
